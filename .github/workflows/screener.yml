name: Update Screener

on:
  schedule:
    # Cadangan saja: jadwal bawaan GitHub sering telat atau terlewat. Pemicu utama sebaiknya dari cron-job.org.
    # Jam GitHub pakai UTC (WIB = UTC + 7).
    # Selama jam istirahat dan setelah closing harga tidak bergerak, jadi run mana pun yang jalan dulu memberi data yang sama.
    - cron: "5,25,50 5 * * 1-4"    # 12:05, 12:25, 12:50 WIB Senin–Kamis (istirahat 12:00–13:30)
    - cron: "15 6 * * 1-4"         # 13:15 WIB Senin–Kamis
    - cron: "35 4 * * 5"           # 11:35 WIB Jumat (istirahat 11:30–14:00)
    - cron: "0,30 5,6 * * 5"       # 12:00, 12:30, 13:00, 13:30 WIB Jumat
    - cron: "10,35 9 * * 1-5"      # 16:10, 16:35 WIB (setelah closing)
    - cron: "5,40 10 * * 1-5"      # 17:05, 17:40 WIB
  workflow_dispatch:               # tombol "Run workflow" (manual) dan pemicu dari cron-job.org
    inputs:
      paksa:
        description: "Simpan hasil walaupun datanya sama dengan run sebelumnya"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Jalankan screener
        run: python idx_screener.py --output docs/index.html --no-arsip

      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.paksa }}" = "false" ]; } && git diff --quiet -- docs/hasil_screener.csv; then
            echo "Data sama dengan run sebelumnya (pasar sedang istirahat/tutup). Tidak ada yang disimpan."
            exit 0
          fi
          git add -A
          git diff --cached --quiet || git commit -m "Update screener $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
          git pull --rebase
          git push
