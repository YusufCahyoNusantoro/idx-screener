name: Update Screener

on:
  schedule:
    # Jadwal GitHub pakai UTC (WIB = UTC + 7). GitHub kadang telat atau melewatkan jadwal,
    # jadi screener dicoba tiap 10 menit selama jam istirahat dan setelah closing.
    # Menit dibuat tidak tepat di awal jam (saat server GitHub paling sibuk).
    # Senin–Kamis, istirahat 12:00–13:30 WIB
    - cron: "7,17,27,37,47,57 5 * * 1-4"     # 12:07 ... 12:57 WIB
    - cron: "7,17,27 6 * * 1-4"              # 13:07, 13:17, 13:27 WIB
    # Jumat, istirahat 11:30–14:00 WIB
    - cron: "37,47,57 4 * * 5"               # 11:37, 11:47, 11:57 WIB
    - cron: "7,17,27,37,47,57 5,6 * * 5"     # 12:07 ... 13:57 WIB
    # Setelah closing (16:00 WIB), Senin–Jumat
    - cron: "7,17,27,37,47,57 9,10 * * 1-5"  # 16:07 ... 17:57 WIB
    - cron: "7,37 11 * * 1-5"                # 18:07, 18:37 WIB
  workflow_dispatch:                         # tombol "Run workflow" untuk jalan manual

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Jalankan screener
        run: python idx_screener.py --output docs/index.html --no-arsip

      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet -- docs/hasil_screener.csv; then
            echo "Data sama dengan run sebelumnya (pasar sedang istirahat/tutup). Tidak ada yang disimpan."
            exit 0
          fi
          git add -A
          git diff --cached --quiet || git commit -m "Update screener $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
          git pull --rebase
          git push
