name: Update Screener

on:
  schedule:
    # Jam GitHub pakai UTC. WIB = UTC + 7.
    - cron: "5 5 * * 1-4"     # 12:05 WIB Senin–Kamis (setelah Sesi 1)
    - cron: "35 4 * * 5"      # 11:35 WIB Jumat (setelah Sesi 1)
    - cron: "10 9 * * 1-5"    # 16:10 WIB Senin–Jumat (setelah closing)
  workflow_dispatch:          # tombol "Run workflow" untuk jalan manual

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Jalankan screener
        run: python idx_screener.py --output docs/index.html --no-arsip

      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update screener $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
          git pull --rebase
          git push
